name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the packed tarball in a clean project and use the CLI
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/rmaneschy-agentskills-*.tgz
          npx agentskills install --target .
          npx agentskills validate .agents/skills --strict

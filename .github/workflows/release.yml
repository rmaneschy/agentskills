name: release

# Runs when a tag like v0.2.0 is pushed.
# Publishes the npm package to GitHub Packages and attaches the tarball
# and a zip of the skills to a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@rmaneschy"

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check

      - name: Pack the tarball and the skills archive
        run: |
          npm pack
          (cd skills && zip -r "../agentskills-skills-$VERSION.zip" .)

      # Both steps below are safe to run again for the same tag: a version that is
      # already in the registry is not republished, and a release that already
      # exists (for example one created by hand on github.com) receives only the
      # files it does not have. An attached file is never deleted or replaced.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@rmaneschy/agentskills@$VERSION" version > /dev/null 2>&1; then
            echo "@rmaneschy/agentskills@$VERSION is already published; skipping."
          else
            npm publish
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; adding the files it does not have."
            existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            for file in rmaneschy-agentskills-*.tgz agentskills-skills-*.zip; do
              if printf '%s\n' "$existing" | grep -Fxq "$file"; then
                echo "$file is already attached; keeping it."
              else
                gh release upload "$GITHUB_REF_NAME" "$file"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" rmaneschy-agentskills-*.tgz agentskills-skills-*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi

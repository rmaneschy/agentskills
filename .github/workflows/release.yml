name: release

# Runs when a tag like v0.1.0 is pushed.
# Publishes: wheel, sdist and a zip of the skills on the GitHub Release,
# and the container image on GitHub Packages (ghcr.io).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        shell: python
        run: |
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          open(os.environ["GITHUB_ENV"], "a").write(f"VERSION={version}\n")

      - name: Test before publishing
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          python -m pytest
          agentskills validate skills --strict

      - name: Build wheel, sdist and skills archive
        run: |
          python -m build
          python -c "import shutil; shutil.make_archive('dist/agentskills-skills-${{ env.VERSION }}', 'zip', 'skills')"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the container image to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

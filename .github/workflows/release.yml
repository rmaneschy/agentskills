name: release

# Runs when a tag like v0.2.0 is pushed.
# Publishes the npm package to GitHub Packages and attaches the tarball
# and a zip of the skills to a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@rmaneschy"

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check

      - name: Pack the tarball and the skills archive
        run: |
          npm pack
          (cd skills && zip -r "../agentskills-skills-$VERSION.zip" .)

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rmaneschy-agentskills-*.tgz agentskills-skills-*.zip --title "$GITHUB_REF_NAME" --generate-notes

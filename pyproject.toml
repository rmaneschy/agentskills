[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rmaneschy-agentskills"
version = "0.1.0"
description = "Python implementation of the Agent Skills format: parse, validate, discover, disclose, activate and delegate skills, plus a bundled skill pack."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodrigo Maneschy" }]
keywords = ["agent-skills", "agents", "llm", "skills", "subagents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
agentskills = "agentskills.cli:main"

[project.urls]
Repository = "https://github.com/rmaneschy/agentskills"
Specification = "https://agentskills.io/specification"

[tool.hatch.build.targets.wheel]
packages = ["src/agentskills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "agentskills/_bundled/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "LICENSE", "AGENTS.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is the formatter's job
